<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#6d4c2f">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a2118">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peticiones">
<title>Peticiones de oración</title>
<link rel="manifest" id="manifestLink">
<link rel="icon" id="faviconLink">
<link rel="apple-touch-icon" id="appleIconLink">
<style>
  :root {
    --bg: #f2ede3;
    --text: #362c22;
    --text-soft: #8a8375;
    --card-bg: #ffffff;
    --card-answered-bg: #eef6ec;
    --accent: #6d4c2f;
    --accent-2: #8a6d4e;
    --tab-bg: #e9e1d1;
    --chip-bg: #f2ede3;
    --chip-text: #7a6f5c;
    --chip-answered-bg: #dcecd6;
    --chip-answered-text: #3f6b31;
    --check-bg: #cfe6c4;
    --check-text: #2f5423;
    --check-done-bg: #ece7da;
    --check-done-text: #7a6f5c;
    --del-bg: #f9e3e3;
    --del-text: #8a2f2f;
    --border: #eae3d5;
    --input-bg: #faf8f3;
    --overlay: rgba(0,0,0,0.45);
    --modal-bg: #ffffff;
    --toast-bg: #362c22;
    --toast-text: #ffffff;
    --error-bg: #f9e0e0;
    --error-text: #7a2e2e;
    --empty-text: #a39c8c;
    --skeleton-a: #ece6d8;
    --skeleton-b: #f7f3e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18140f;
      --text: #f0e9dc;
      --text-soft: #a99f8c;
      --card-bg: #251e16;
      --card-answered-bg: #1c2818;
      --accent: #d3a878;
      --accent-2: #c19768;
      --tab-bg: #251e16;
      --chip-bg: #2e2519;
      --chip-text: #c7bca8;
      --chip-answered-bg: #24331d;
      --chip-answered-text: #9fd48b;
      --check-bg: #2f4227;
      --check-text: #bfe6ab;
      --check-done-bg: #2e2519;
      --check-done-text: #a99f8c;
      --del-bg: #3a2323;
      --del-text: #e6a3a3;
      --border: #382e21;
      --input-bg: #201a13;
      --overlay: rgba(0,0,0,0.65);
      --modal-bg: #201a13;
      --toast-bg: #000000;
      --toast-text: #ffffff;
      --error-bg: #3a2323;
      --error-text: #e6a3a3;
      --empty-text: #7a7264;
      --skeleton-a: #2a2218;
      --skeleton-b: #33291c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: 'Segoe UI', Roboto, -apple-system, Arial, sans-serif;
    color: var(--text);
    overscroll-behavior-y: contain;
  }
  body { padding-bottom: 90px; transition: background 0.2s ease, color 0.2s ease; }

  /* Header */
  .appbar {
    background: linear-gradient(135deg, #6d4c2f, #8a6d4e);
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 26px;
    text-align: center;
    border-radius: 0 0 22px 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    position: relative;
  }
  .appbar h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: 0.2px; }
  .appbar p { margin: 6px 0 0; font-size: 13px; opacity: 0.85; }

  .container { max-width: 560px; margin: 0 auto; padding: 16px; }

  /* Pull to refresh */
  .ptr-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 0;
    overflow: hidden;
    color: var(--accent);
    font-size: 13px;
    gap: 8px;
    transition: height 0.15s ease;
  }
  .ptr-indicator.dragging { transition: none; }
  .ptr-spinner {
    width: 18px; height: 18px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
  }
  .ptr-spinner.spin { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Install banner */
  .install-banner {
    display: none;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    margin: -30px 0 16px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }
  .install-banner.show { display: flex; }
  .install-banner .ib-icon { font-size: 26px; line-height: 1; }
  .install-banner .ib-text { flex: 1; }
  .install-banner .ib-title { font-size: 13.5px; font-weight: 700; }
  .install-banner .ib-sub { font-size: 11.5px; color: var(--text-soft); margin-top: 1px; }
  .install-banner button { border: none; border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .install-banner .ib-install { background: var(--accent); color: #fff; }
  .install-banner .ib-dismiss { background: transparent; color: var(--text-soft); padding: 9px 8px; }

  /* Stats */
  .stats { display: flex; gap: 10px; margin: -34px 0 18px; }
  .stat-card {
    flex: 1;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--tab-bg);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1;
    padding: 13px;
    min-height: 48px;
    border: none;
    border-radius: 11px;
    background: transparent;
    color: var(--text-soft);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab-btn.active { background: var(--card-bg); color: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

  /* Swipe wrapper */
  .swipe-item { position: relative; border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .swipe-bg {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    font-size: 22px;
    opacity: 0;
    border-radius: 16px;
  }
  .swipe-bg.right-action { justify-content: flex-start; padding-left: 26px; background: var(--check-bg); color: var(--check-text); }
  .swipe-bg.left-action { justify-content: flex-end; padding-right: 26px; background: var(--del-bg); color: var(--del-text); }

  /* Cards */
  .card {
    position: relative;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    animation: fadeIn 0.25s ease;
    touch-action: pan-y;
    will-change: transform;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .card.answered { background: var(--card-answered-bg); }
  .peticion-text { font-size: 15.5px; margin: 0 0 10px; line-height: 1.5; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    font-size: 11.5px;
    background: var(--chip-bg);
    color: var(--chip-text);
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .card.answered .chip { background: var(--chip-answered-bg); color: var(--chip-answered-text); }

  .actions { display: flex; gap: 8px; }
  .check-btn, .del-btn {
    border: none;
    border-radius: 12px;
    padding: 12px;
    min-height: 48px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    flex: 1;
    transition: transform 0.1s ease;
    position: relative;
    overflow: hidden;
  }
  .check-btn:active, .del-btn:active { transform: scale(0.96); }
  .check-btn { background: var(--check-bg); color: var(--check-text); }
  .check-btn.done { background: var(--check-done-bg); color: var(--check-done-text); flex: 1; }
  .del-btn { background: var(--del-bg); color: var(--del-text); flex: none; width: 50px; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(0,0,0,0.12);
    transform: scale(0);
    animation: ripple 0.5s ease-out;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }

  .empty { text-align: center; color: var(--empty-text); padding: 60px 20px; }
  .empty i { font-size: 42px; display: block; margin-bottom: 10px; opacity: 0.5; }

  /* Skeleton */
  .skeleton-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .sk-line {
    height: 13px;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite;
    margin-bottom: 10px;
  }
  .sk-line.w60 { width: 60%; }
  .sk-line.w40 { width: 40%; height: 22px; margin-bottom: 14px; }
  .sk-line.w90 { width: 90%; }
  .sk-chip { width: 70px; height: 20px; border-radius: 20px; display: inline-block; margin-right: 6px;
    background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .error-box {
    background: var(--error-bg);
    color: var(--error-text);
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 13px;
  }

  /* FAB */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    background: var(--accent);
    color: #fff;
    border: none;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 28px;
    box-shadow: 0 4px 14px rgba(109,76,47,0.45);
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
    overflow: hidden;
  }
  .fab:active { transform: scale(0.9); }

  /* Bottom sheet modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 30;
    align-items: flex-end;
  }
  .modal-overlay.show { display: flex; animation: fadeBg 0.2s ease; }
  @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--modal-bg);
    border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    animation: slideUp 0.25s ease;
    max-height: 88vh;
    overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 14px; }
  .modal h2 { margin: 0 0 4px; font-size: 19px; color: var(--text); }
  .modal .modal-sub { font-size: 13px; color: var(--text-soft); margin-bottom: 16px; }
  .modal label { font-size: 13px; color: var(--text-soft); font-weight: 600; display: block; margin: 14px 0 6px; }
  .modal textarea, .modal input[type="date"], .modal input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .modal textarea:focus, .modal input:focus { border-color: var(--accent-2); }
  .modal textarea { resize: vertical; min-height: 80px; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 22px; }
  .modal-buttons button {
    flex: 1;
    padding: 14px;
    min-height: 48px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    font-weight: 700;
  }
  .btn-cancel { background: var(--tab-bg); color: var(--text-soft); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:disabled { opacity: 0.6; }

  /* Toast / Snackbar */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    transform: translateX(-50%) translateY(20px);
    background: var(--toast-bg);
    color: var(--toast-text);
    padding: 12px 12px 12px 20px;
    border-radius: 30px;
    font-size: 13.5px;
    z-index: 40;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: calc(100vw - 40px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .snackbar-action {
    background: transparent;
    border: none;
    color: #d3a878;
    font-weight: 700;
    font-size: 13px;
    padding: 8px 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="appbar">
  <h1>🙏 Peticiones de oración</h1>
  <p>Comparte tu petición y celebra cuando Dios responda</p>
</div>

<div class="container">
  <div class="ptr-indicator" id="ptrIndicator"><div class="ptr-spinner" id="ptrSpinner"></div><span id="ptrLabel">Desliza para actualizar</span></div>

  <div class="install-banner" id="installBanner">
    <div class="ib-icon">🙏</div>
    <div class="ib-text">
      <div class="ib-title">Instala la app</div>
      <div class="ib-sub">Acceso directo desde tu pantalla de inicio</div>
    </div>
    <button class="ib-dismiss" onclick="dismissInstallBanner()">Ahora no</button>
    <button class="ib-install" onclick="installApp()">Instalar</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statPend">0</div>
      <div class="stat-label">Pendientes</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statResp">0</div>
      <div class="stat-label">Contestadas</div>
    </div>
  </div>

  <div id="errorBox"></div>

  <div class="tabs">
    <button class="tab-btn active" id="tabPend" onclick="switchTab('pendientes')">Pendientes</button>
    <button class="tab-btn" id="tabResp" onclick="switchTab('respondidas')">Respondidas</button>
  </div>

  <div id="lista">
    <div class="skeleton-card"><div class="sk-line w90"></div><div class="sk-line w60"></div><div><span class="sk-chip"></span><span class="sk-chip"></span></div></div>
    <div class="skeleton-card"><div class="sk-line w90"></div><div class="sk-line w60"></div><div><span class="sk-chip"></span><span class="sk-chip"></span></div></div>
    <div class="skeleton-card"><div class="sk-line w90"></div><div class="sk-line w60"></div><div><span class="sk-chip"></span><span class="sk-chip"></span></div></div>
  </div>
</div>

<button class="fab" onclick="openModal(event)" aria-label="Nueva petición">+</button>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Nueva petición</h2>
    <p class="modal-sub">Puedes dejarla anónima si prefieres</p>

    <label>Tu petición</label>
    <textarea id="inputTexto" placeholder="Escribe tu petición..."></textarea>

    <label>Fecha (opcional)</label>
    <input type="date" id="inputFecha">

    <label>Nombre (opcional)</label>
    <input type="text" id="inputNombre" placeholder="Deja vacío para publicar anónimamente">

    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" id="btnGuardar" onclick="guardarPeticion(event)">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// URL de tu aplicación web de Apps Script
const API_URL = 'https://script.google.com/macros/s/AKfycbx_AuFOtpg8HF9aRfQmTZdkpli2G_dAdADIaZd5TZZUbqAXHCaBr1xD2JzXl2uUZ7hF/exec';

let peticiones = [];
let tabActual = 'pendientes';
let cargaInicial = true;

/* ============ ICONOS + MANIFEST PWA ============ */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function generarIcono(size, maskable) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#6d4c2f';
  if (maskable) {
    ctx.fillRect(0, 0, size, size);
  } else {
    roundRect(ctx, 0, 0, size, size, size * 0.22);
    ctx.fill();
  }
  ctx.font = `${size * (maskable ? 0.42 : 0.55)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🙏', size / 2, size / 2 + size * 0.04);
  return canvas.toDataURL('image/png');
}

const icon192 = generarIcono(192, false);
const icon512 = generarIcono(512, false);
const iconMaskable = generarIcono(512, true);

document.getElementById('faviconLink').setAttribute('href', icon192);
document.getElementById('appleIconLink').setAttribute('href', icon192);

const manifest = {
  name: "Peticiones de oración",
  short_name: "Peticiones",
  description: "Comparte tus peticiones de oración y celebra cuando Dios responda.",
  start_url: ".",
  scope: ".",
  display: "standalone",
  orientation: "portrait",
  background_color: "#f2ede3",
  theme_color: "#6d4c2f",
  icons: [
    { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
    { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
    { src: iconMaskable, sizes: "512x512", type: "image/png", purpose: "maskable" }
  ]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
document.getElementById('manifestLink').setAttribute('href', URL.createObjectURL(manifestBlob));

/* ============ SERVICE WORKER (offline) ============ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // Si el archivo sw.js no está publicado junto a este HTML, se ignora
    });
  });
}

/* ============ INSTALAR EN ANDROID ============ */
let deferredPrompt = null;
let installDismissed = false;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!installDismissed) {
    document.getElementById('installBanner').classList.add('show');
  }
});
function dismissInstallBanner() {
  installDismissed = true;
  document.getElementById('installBanner').classList.remove('show');
}
async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
}
window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').classList.remove('show');
  showSnackbar('¡App instalada! 🙏');
});

/* ============ RIPPLE TÁCTIL ============ */
function agregarRipple(el, ev) {
  const rect = el.getBoundingClientRect();
  const touch = ev.changedTouches ? ev.changedTouches[0] : ev;
  const x = (touch.clientX - rect.left);
  const y = (touch.clientY - rect.top);
  const ripple = document.createElement('span');
  const size = Math.max(rect.width, rect.height);
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (x - size / 2) + 'px';
  ripple.style.top = (y - size / 2) + 'px';
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 500);
}
function vibrar(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

/* ============ SNACKBAR ============ */
let snackbarTimer;
function showSnackbar(msg, actionLabel, actionFn) {
  const t = document.getElementById('toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  if (actionLabel && actionFn) {
    const btn = document.createElement('button');
    btn.className = 'snackbar-action';
    btn.textContent = actionLabel;
    btn.onclick = actionFn;
    t.appendChild(btn);
  }
  t.classList.add('show');
  clearTimeout(snackbarTimer);
  snackbarTimer = setTimeout(() => t.classList.remove('show'), 4200);
}
function hideSnackbar() {
  document.getElementById('toast').classList.remove('show');
  clearTimeout(snackbarTimer);
}

function mostrarError(msg) {
  document.getElementById('errorBox').innerHTML = `<div class="error-box">${msg}</div>`;
}
function limpiarError() {
  document.getElementById('errorBox').innerHTML = '';
}

/* ============ CARGA DE DATOS ============ */
async function cargarPeticiones(silencioso) {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('Respuesta no válida del servidor');
    peticiones = await res.json();
    limpiarError();
    render();
  } catch (err) {
    mostrarError('No se pudieron cargar las peticiones. Revisa tu conexión.');
    if (!silencioso) document.getElementById('lista').innerHTML = '';
    console.error(err);
  } finally {
    cargaInicial = false;
  }
}

/* ============ PULL TO REFRESH ============ */
(function initPullToRefresh() {
  const container = document.querySelector('.container');
  const indicator = document.getElementById('ptrIndicator');
  const spinner = document.getElementById('ptrSpinner');
  const label = document.getElementById('ptrLabel');
  let startY = 0, pulling = false, triggered = false;
  const THRESHOLD = 64;

  container.addEventListener('touchstart', (e) => {
    if (window.scrollY > 4) return;
    startY = e.touches[0].clientY;
    pulling = true;
    triggered = false;
    indicator.classList.add('dragging');
  }, { passive: true });

  container.addEventListener('touchmove', (e) => {
    if (!pulling) return;
    const delta = e.touches[0].clientY - startY;
    if (delta <= 0) { indicator.style.height = '0px'; return; }
    const h = Math.min(delta * 0.5, 70);
    indicator.style.height = h + 'px';
    const ready = h >= THRESHOLD * 0.9;
    label.textContent = ready ? 'Suelta para actualizar' : 'Desliza para actualizar';
    if (ready && !triggered) { triggered = true; vibrar(10); }
  }, { passive: true });

  container.addEventListener('touchend', () => {
    if (!pulling) return;
    pulling = false;
    indicator.classList.remove('dragging');
    if (triggered) {
      indicator.style.height = '46px';
      spinner.classList.add('spin');
      label.textContent = 'Actualizando...';
      cargarPeticiones(true).finally(() => {
        spinner.classList.remove('spin');
        indicator.style.height = '0px';
      });
    } else {
      indicator.style.height = '0px';
    }
  });
})();

/* ============ MODAL (con soporte de botón atrás) ============ */
function openModal(ev) {
  if (ev) agregarRipple(document.querySelector('.fab'), ev);
  document.getElementById('inputTexto').value = '';
  document.getElementById('inputFecha').value = '';
  document.getElementById('inputNombre').value = '';
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  history.pushState({ modal: true }, '');
  setTimeout(() => document.getElementById('inputTexto').focus(), 200);
}
function cerrarModalVisual() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}
function closeModal() {
  if (history.state && history.state.modal) {
    history.back();
  } else {
    cerrarModalVisual();
  }
}
window.addEventListener('popstate', () => {
  cerrarModalVisual();
});

async function guardarPeticion(ev) {
  const texto = document.getElementById('inputTexto').value.trim();
  if (!texto) { showSnackbar('Escribe tu petición primero'); return; }
  const fecha = document.getElementById('inputFecha').value;
  const nombre = document.getElementById('inputNombre').value.trim();

  const btn = document.getElementById('btnGuardar');
  if (ev) agregarRipple(btn, ev);
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'crear', texto, fecha, nombre })
    });
    closeModal();
    await cargarPeticiones();
    vibrar(15);
    showSnackbar('Petición guardada 🙏');
  } catch (err) {
    showSnackbar('No se pudo guardar. Intenta de nuevo.');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Guardar';
  }
}

/* ============ MARCAR / REABRIR ============ */
async function toggleRespondida(id) {
  const p = peticiones.find(x => x.id === id);
  const nuevoEstado = p ? !p.respondida : true;
  if (p) p.respondida = nuevoEstado; // optimista
  render();
  vibrar(nuevoEstado ? 20 : 10);
  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'toggle', id })
    });
    showSnackbar(nuevoEstado ? '¡Gloria a Dios! Marcada como contestada 🎉' : 'Movida de nuevo a pendientes');
    await cargarPeticiones(true);
  } catch (err) {
    showSnackbar('No se pudo actualizar.');
    console.error(err);
    await cargarPeticiones(true);
  }
}

/* ============ ELIMINAR CON DESHACER ============ */
const pendingDeletes = {};
function solicitarEliminar(id) {
  const idx = peticiones.findIndex(x => x.id === id);
  if (idx === -1) return;
  const item = peticiones[idx];
  peticiones.splice(idx, 1);
  render();
  vibrar(20);
  const timeoutId = setTimeout(() => confirmarEliminar(id), 4000);
  pendingDeletes[id] = { timeoutId, item, idx };
  showSnackbar('Petición eliminada', 'Deshacer', () => deshacerEliminar(id));
}
function deshacerEliminar(id) {
  const pd = pendingDeletes[id];
  if (!pd) return;
  clearTimeout(pd.timeoutId);
  peticiones.splice(pd.idx, 0, pd.item);
  delete pendingDeletes[id];
  render();
  hideSnackbar();
}
async function confirmarEliminar(id) {
  const pd = pendingDeletes[id];
  if (!pd) return;
  delete pendingDeletes[id];
  try {
    await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'eliminar', id }) });
  } catch (err) {
    console.error(err);
  }
}

function switchTab(tab) {
  tabActual = tab;
  document.getElementById('tabPend').classList.toggle('active', tab === 'pendientes');
  document.getElementById('tabResp').classList.toggle('active', tab === 'respondidas');
  render();
}

/* ============ RENDER ============ */
function render() {
  const lista = document.getElementById('lista');
  const pendientes = peticiones.filter(p => !p.respondida);
  const respondidas = peticiones.filter(p => p.respondida);

  document.getElementById('statPend').textContent = pendientes.length;
  document.getElementById('statResp').textContent = respondidas.length;

  const filtradas = tabActual === 'pendientes' ? pendientes : respondidas;

  if (cargaInicial) return; // mantiene el skeleton mientras carga la primera vez

  if (filtradas.length === 0) {
    lista.innerHTML = `<div class="empty">
      <i>${tabActual === 'pendientes' ? '🙏' : '✨'}</i>
      ${tabActual === 'pendientes' ? 'No hay peticiones pendientes todavía.<br>Toca + para agregar la primera.' : 'Aún no hay peticiones contestadas.<br>¡Sigue orando!'}
    </div>`;
    return;
  }

  lista.innerHTML = filtradas.map(p => `
    <div class="swipe-item" data-id="${p.id}">
      <div class="swipe-bg right-action">✓ Cumplida</div>
      <div class="swipe-bg left-action">Eliminar 🗑</div>
      <div class="card ${p.respondida ? 'answered' : ''}" data-id="${p.id}">
        <p class="peticion-text">${escapeHtml(p.texto)}</p>
        <div class="meta">
          <span class="chip">${p.nombre ? escapeHtml(p.nombre) : 'Anónimo'}</span>
          ${p.fecha ? `<span class="chip">📅 ${p.fecha}</span>` : ''}
          <span class="chip">🕓 ${p.creada}</span>
        </div>
        <div class="actions">
          <button class="check-btn ${p.respondida ? 'done' : ''}" onclick="agregarRipple(this,event); toggleRespondida('${p.id}')">
            ${p.respondida ? '↩ Reabrir' : '✓ Marcar cumplida'}
          </button>
          <button class="del-btn" onclick="agregarRipple(this,event); solicitarEliminar('${p.id}')" aria-label="Eliminar">🗑</button>
        </div>
      </div>
    </div>
  `).join('');

  attachSwipeHandlers();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ============ SWIPE EN TARJETAS (estilo Android) ============ */
function attachSwipeHandlers() {
  document.querySelectorAll('.swipe-item').forEach(wrap => {
    const card = wrap.querySelector('.card');
    const bgRight = wrap.querySelector('.right-action');
    const bgLeft = wrap.querySelector('.left-action');
    const id = wrap.dataset.id;
    const THRESHOLD = 84;
    let startX = 0, startY = 0, dx = 0, dragging = false, axisLocked = null;

    card.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      dx = 0; dragging = true; axisLocked = null;
      card.style.transition = 'none';
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const x = e.touches[0].clientX - startX;
      const y = e.touches[0].clientY - startY;
      if (axisLocked === null) {
        axisLocked = Math.abs(x) > Math.abs(y) ? 'x' : 'y';
      }
      if (axisLocked === 'y') return; // deja hacer scroll vertical normal
      dx = x;
      const clamped = Math.max(-120, Math.min(120, dx));
      card.style.transform = `translateX(${clamped}px)`;
      bgRight.style.opacity = clamped > 0 ? Math.min(clamped / THRESHOLD, 1) : 0;
      bgLeft.style.opacity = clamped < 0 ? Math.min(-clamped / THRESHOLD, 1) : 0;
    }, { passive: true });

    card.addEventListener('touchend', () => {
      if (!dragging) return;
      dragging = false;
      card.style.transition = 'transform 0.2s ease';
      if (axisLocked === 'x' && dx > THRESHOLD) {
        card.style.transform = `translateX(140%)`;
        vibrar(15);
        setTimeout(() => toggleRespondida(id), 150);
      } else if (axisLocked === 'x' && dx < -THRESHOLD) {
        card.style.transform = `translateX(-140%)`;
        vibrar(15);
        setTimeout(() => solicitarEliminar(id), 150);
      } else {
        card.style.transform = 'translateX(0)';
        bgRight.style.opacity = 0;
        bgLeft.style.opacity = 0;
      }
    });
  });
}

cargarPeticiones();
</script>
